name: terraform-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: 1.17.0
  TFLINT_VERSION: v0.65.0
  TF_IN_AUTOMATION: "true"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive -diff

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [modules/vnet, modules/peering, modules/databricks-workspace, envs/dev]
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform -chdir=${{ matrix.dir }} init -backend=false -input=false
      - run: terraform -chdir=${{ matrix.dir }} validate -no-color

  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - run: tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
      - run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [modules/vnet, modules/peering, modules/databricks-workspace, envs/dev]
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform -chdir=${{ matrix.dir }} init -backend=false -input=false
      - run: terraform -chdir=${{ matrix.dir }} test -no-color

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/test-assert-plan.sh

  security:
    # Soft-fail until the findings are triaged (see README).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install checkov
      - run: checkov -d . --framework terraform --soft-fail --compact --quiet

  # Real plan against Azure. Runs only when the repo variable AZURE_CLIENT_ID is
  # set (OIDC federated credential, no client secret) and never for fork PRs,
  # which get no OIDC token. Uses local state, so the plan always starts from
  # the import step; see README for using the azurerm backend instead.
  plan:
    needs: [fmt, validate, test, scripts]
    if: >-
      vars.AZURE_CLIENT_ID != '' &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_enable_databricks: ${{ vars.ENABLE_DATABRICKS == 'true' }}
      ASSERT_MODE: ${{ vars.ENABLE_DATABRICKS == 'true' && 'no-destroy' || 'import-only' }}
    defaults:
      run:
        working-directory: envs/dev
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform init -input=false
      - run: terraform plan -input=false -no-color -out=tfplan
      - run: terraform show -json -no-color tfplan > plan.json
      - run: ../../scripts/assert-plan.sh plan.json "$ASSERT_MODE"
